[package]
name = "kultura-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
teloxide = { version = "0.17", default-features = false, features = ["ctrlc_handler", "rustls"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
serde_json = "1"
